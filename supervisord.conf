[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1280x720x24 -nolisten tcp
user=agent
environment=HOME="/home/agent",DISPLAY=":0"
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
user=agent
environment=HOME="/home/agent",DISPLAY=":0",XDG_RUNTIME_DIR="/home/agent/.run"
priority=20
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -forever -shared -rfbauth /home/agent/.vnc/passwd -rfbport 5900 -noxdamage -repeat -quiet
user=agent
environment=HOME="/home/agent",DISPLAY=":0"
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
user=agent
environment=HOME="/home/agent"
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agentos]
command=/bin/bash -lc "cd /home/agent/agent-platform && exec /home/agent/venv/bin/uvicorn aap.api.app:app --host 127.0.0.1 --port 7860"
user=agent
environment=HOME="/home/agent",DISPLAY=":0",AAP_DATA_DIR="/data"
priority=40
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
